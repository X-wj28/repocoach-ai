services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repocoach
      POSTGRES_USER: repocoach
      POSTGRES_PASSWORD: repocoach
    ports:
      - "5432:5432"
    volumes:
      - repocoach_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  repocoach_pgdata:

