name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://repocoach:repocoach@localhost:5432/repocoach?schema=public

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repocoach
          POSTGRES_PASSWORD: repocoach
          POSTGRES_DB: repocoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repocoach -d repocoach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Lint web
        run: npm run lint
      - name: Test API
        run: npm run test:api
      - name: Test web state and HTTP boundaries
        run: npm run test:web
      - name: Validate rubric evaluation fixtures
        run: npm run eval:rubric
      - name: Test PostgreSQL migrations and transactions
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://repocoach:repocoach@localhost:5432/repocoach?schema=public
      - name: Test HTTP user journeys and phase recovery
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://repocoach:repocoach@localhost:5432/repocoach?schema=public
      - name: Build production bundles
        run: npm run build
      - name: Test production UI in Chromium
        run: npm run test:browser
      - name: Upload browser acceptance artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            data/browser-acceptance-*/*.png
            data/browser-acceptance-*/*checks.json
            data/browser-acceptance-*/app-preview-server.log
          if-no-files-found: ignore
          retention-days: 7
